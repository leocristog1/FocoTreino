<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ficha de treino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap">
<style>
:root{--bg:#f2f4f9;--card:#ffffff;--ink:#0e1220;--mut:#667089;--line:#e3e7f0;--track:#eaeef6;--ac:#3b5bdb;--navbg:rgba(255,255,255,.84);--sh:0 1px 2px rgba(16,24,40,.05),0 10px 28px rgba(16,24,40,.07);--up:#0b8f4a;
--fd:"Sora",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--fb:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080b14;--card:#121829;--ink:#eff2fb;--mut:#8e99b4;--line:#212a42;--track:#1a2236;--navbg:rgba(12,17,31,.84);--sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);--up:#3ecf8e}}
:root[data-theme="dark"]{--bg:#080b14;--card:#121829;--ink:#eff2fb;--mut:#8e99b4;--line:#212a42;--track:#1a2236;--navbg:rgba(12,17,31,.84);--sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);--up:#3ecf8e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
button{font:inherit;color:inherit;cursor:pointer}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--fb);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 170px}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.bar-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:16px 0 10px;display:flex;align-items:center;gap:10px}
.bar-top h1{font:800 26px/1.1 var(--fd);letter-spacing:-.03em;margin:0;flex:1}
.back{border:1px solid var(--line);background:var(--card);border-radius:14px;width:40px;height:40px;font-size:20px;line-height:1;box-shadow:var(--sh)}
.sub{color:var(--mut);font-size:14px;margin:0 0 8px}
.sub b{color:var(--ink)}
/* semana */
.wk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 14px;margin-top:10px;box-shadow:var(--sh);transition:transform .15s}
button.wk:active{transform:scale(.985)}
.wk .d{flex:none;width:48px;height:48px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 13px/1.1 var(--fd);background:var(--c);color:#fff}
.wk.rest .d{background:var(--track);color:var(--mut)}
.dt{font-size:10px;font-weight:500;opacity:.85;color:inherit}
.wk .m{flex:1;min-width:0}
.wk .m b{display:block;font:700 16px/1.25 var(--fd);letter-spacing:-.01em}
.wk .m span{color:var(--mut);font-size:13px}
.wk .p{width:70px;text-align:right;font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.mini{height:6px;border-radius:9px;background:var(--track);margin-top:5px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--c);border-radius:9px}
.badge{display:inline-block;background:var(--c,var(--ac));color:#fff;border-radius:99px;font:600 10.5px/1 var(--fb);padding:4px 8px;margin-left:8px;vertical-align:middle}
.wk.rest{opacity:.7}.wk.done{opacity:.75}
/* hero */
.hero{position:relative;overflow:hidden;color:#fff;border-radius:28px;padding:20px 20px 18px;background:var(--ac);background-image:linear-gradient(140deg,color-mix(in srgb,var(--ac) 88%,#fff),color-mix(in srgb,var(--ac) 68%,#000))}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:230px;height:230px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.26),transparent);pointer-events:none}
.hr{display:flex;justify-content:space-between;gap:14px;align-items:center;position:relative;z-index:1}
.hero .day{font-size:13px;opacity:.88;font-weight:500}
.hero h2{font:800 29px/1.08 var(--fd);letter-spacing:-.03em;margin:5px 0}
.hero p{margin:0;opacity:.92;font-size:14px}
.rg{position:relative;width:74px;height:74px;flex:none}
.rg svg{width:100%;height:100%;display:block}
.rg circle{fill:none;stroke-width:4.5;stroke-linecap:round}
.rg .rt{stroke:rgba(255,255,255,.28)}.rg .rp{stroke:#fff}
.rg b{position:absolute;inset:0;display:grid;place-items:center;font:700 15px var(--fd)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px;position:relative;z-index:1}
.chip{background:rgba(255,255,255,.18);border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:500}
/* cards */
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px 16px 14px;margin-top:14px;box-shadow:var(--sh)}
.card::before{content:"";position:absolute;left:18px;top:0;width:34px;height:4px;border-radius:0 0 5px 5px;background:var(--ac)}
.card.fin{opacity:.6}
.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.name{font:700 16.5px/1.28 var(--fd);letter-spacing:-.01em}
.meta{color:var(--mut);font-size:13px;margin-top:3px}
.hist{margin-top:2px}.hist b{color:var(--ink);font-weight:600}
.up{color:var(--up);font-weight:650}.dn{color:var(--mut);font-weight:650}
.sr{text-align:right;white-space:nowrap}
.sr b{font:800 22px var(--fd);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.sr span{display:block;font-size:11.5px;color:var(--mut)}
.fgt{margin-top:12px;border-radius:18px;padding:10px 8px 6px;background:var(--track);background:color-mix(in srgb,var(--ac) 8%,var(--card))}
.mv{width:100%;max-width:250px;height:auto;display:block;margin:0 auto;color:var(--ink);fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.mv.one{max-width:130px}
.mv .eq{stroke:var(--mut);stroke-width:2.8}
.mv .eq rect{fill:var(--track)}
.mv .wt{fill:var(--ac);stroke:none}
.mv .hd{fill:var(--card)}
.mv .ar{stroke:var(--mut);stroke-width:1.8}
.lb{display:flex;justify-content:space-around;max-width:250px;margin:0 auto;font-size:11.5px;color:var(--mut)}
.sets{display:flex;align-items:center;gap:7px;margin-top:12px}
.set{flex:1;max-width:60px;height:46px;border-radius:15px;border:1.5px solid var(--line);background:var(--track);color:var(--mut);font:700 15px var(--fd);transition:transform .12s,background .2s,border-color .2s}
.set:active{transform:scale(.92)}
.set[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:#fff}
.set.just{animation:pop .38s cubic-bezier(.3,1.6,.5,1)}
.kg{margin-left:auto;display:flex;align-items:center}
.kg input{width:68px;height:46px;border-radius:15px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:700 15px var(--fd);text-align:center}
.how{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.how summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ac)}
.cues{margin:10px 0 0;padding-left:18px;font-size:13.5px;color:var(--mut)}.cues li{margin:4px 0}
.vid{display:inline-block;margin-top:8px;font-size:13px;font-weight:600;color:var(--ac)}
.note{background:var(--card);border:1px dashed var(--line);border-radius:18px;padding:12px 14px;margin-top:12px;color:var(--mut);font-size:14px}
.restbox{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:24px 20px;margin-top:6px;box-shadow:var(--sh)}
.restbox h2{margin:0 0 8px;font:800 24px/1.15 var(--fd);letter-spacing:-.02em}
.restbox p{margin:0 0 8px;color:var(--mut)}
.go{display:block;width:100%;height:52px;border:0;border-radius:18px;background:var(--ac);color:#fff;font:700 15.5px var(--fd);margin-top:16px;box-shadow:0 8px 20px color-mix(in srgb,var(--ac) 35%,transparent);transition:transform .12s}
.go:active{transform:scale(.98)}
.reset{background:none;border:1px solid var(--line);color:var(--mut);border-radius:14px;padding:10px 14px;font-size:13px;margin-top:14px}
.reset.warn{border-color:#e8590c;color:#e8590c}
.savd{color:var(--mut);font-size:12.5px;margin:8px 0 0}
.plan{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:13px 15px;margin-top:8px}
.plan summary{cursor:pointer;font-weight:650;font-size:14.5px}
.plan label{display:block;font-size:13px;color:var(--mut);margin-top:10px}
.plan select,.plan input{width:100%;height:44px;border-radius:13px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;padding:0 10px;margin-top:4px}
.card .plan{background:none;border:0;padding:0;margin-top:10px}
.pwho{margin:10px 0 0;font-size:14px}
.pnote{margin:8px 0 0;font-size:13px;color:var(--mut);background:var(--bg);border-radius:12px;padding:8px 10px}
.pw{margin-top:12px}.pw b{font-family:var(--fd)}
.pe{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--mut);padding:4px 0;border-bottom:1px solid var(--line)}
.pe span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink)}
.spark{width:100%;height:56px;margin-top:10px;display:block}
.spark polyline{fill:none;stroke:var(--ac);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.spark circle{fill:var(--ac)}
.span{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;margin-top:2px}
/* sprint */
.spx{--pc:var(--ac);background:var(--card);border:1px solid var(--line);border-radius:30px;padding:22px 18px 18px;box-shadow:var(--sh);text-align:center;transition:background .4s}
.spx[data-ph="pre"]{--pc:#f59f00}.spx[data-ph="sprint"]{--pc:#f03e3e;background:color-mix(in srgb,#f03e3e 10%,var(--card))}
.spx[data-ph="walk"]{--pc:#12b886;background:color-mix(in srgb,#12b886 9%,var(--card))}.spx[data-ph="done"]{--pc:#7048e8}
.spring{position:relative;width:min(78vw,280px);margin:0 auto}
.spring svg{width:100%;display:block}
.spring circle{fill:none;stroke-width:12;stroke-linecap:round}
.spring .tr{stroke:var(--track)}
.spring .pg{stroke:var(--pc);stroke-dasharray:615.75;transition:stroke-dashoffset .25s linear,stroke .3s}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sph{font:800 14px var(--fd);letter-spacing:.05em;text-transform:uppercase;color:var(--pc)}
.spt{font:800 clamp(46px,16vw,64px)/1.05 var(--fd);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.spn{font-size:13px;color:var(--mut);margin-top:2px;padding:0 22px;line-height:1.3}
.spdots{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:18px 0 4px}
.spdots i{width:13px;height:13px;border-radius:50%;background:var(--track);border:1.5px solid var(--line)}
.spdots i.on{background:var(--pc);border-color:var(--pc)}
.spdots i.cur{border-color:var(--pc);animation:pulse 1s infinite}
.spbig{margin-top:8px}.spbig b{font:800 42px var(--fd);letter-spacing:-.03em}.spbig span{display:block;font-size:13px;color:var(--mut)}
.spctl{display:flex;gap:10px;margin-top:16px;align-items:center}
.spctl .go{margin:0;flex:1}.spctl .reset{margin:0;height:52px}
.spx .go{background:var(--pc);box-shadow:0 8px 20px color-mix(in srgb,var(--pc) 35%,transparent)}
.spcfg{display:flex;align-items:center;justify-content:space-between;margin-top:16px;font-size:14px;color:var(--mut)}
.stp{display:flex;align-items:center;gap:12px}
.stp button{width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:var(--track);font-size:20px;line-height:1}
.stp b{min-width:26px;font:700 16px var(--fd);color:var(--ink)}
.spnote{margin-top:14px;font-size:13px;color:var(--mut);background:var(--card);border:1px dashed var(--line);border-radius:18px;padding:12px 14px}
.splog{margin-top:14px;font-size:13.5px;color:var(--mut)}.splog div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
/* motion */
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ringin{from{stroke-dashoffset:113.1}}
@keyframes pulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--pc) 28%,transparent)}}
#app.enter .card,#app.enter .wk,#app.enter .hero,#app.enter .restbox,#app.enter .spx,#app.enter .plan,#app.enter .note{animation:up .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
#app.enter .rp{animation:ringin .9s .15s ease-out both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* timer + nav */
.tm{position:fixed;left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:18px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;z-index:25;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.tm[hidden]{display:none}
.tm .t{font:700 14px var(--fd);font-variant-numeric:tabular-nums;min-width:132px}
.tm .tb{flex:1;height:6px;border-radius:9px;background:rgba(128,128,128,.4);overflow:hidden}
.tm .tb i{display:block;height:100%;background:var(--bg);width:100%}
.tm button{border:0;background:rgba(128,128,128,.35);color:inherit;border-radius:11px;padding:8px 12px;font-size:13px;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;gap:4px;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--navbg);-webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px);border-top:1px solid var(--line)}
nav button{flex:1;min-width:0;max-width:104px;border:0;background:none;border-radius:16px;padding:7px 2px 6px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;transition:color .2s,background .2s}
nav button[aria-current="page"]{color:var(--ink);background:var(--track)}
nav button[aria-current="page"] svg{stroke:var(--ac)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="tm" id="tm" hidden><span class="t" id="tt"></span><div class="tb"><i id="tf"></i></div><button id="ts">Pular</button></div>
<nav>
  <button id="n1"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>Semana</button>
  <button id="n2"><svg viewBox="0 0 24 24"><path d="M6 8v8M3.5 10v4M18 8v8M20.5 10v4M6 12h12"/></svg>Hoje</button>
  <button id="n3"><svg viewBox="0 0 24 24"><path d="M3.5 17l5.5-6 4 4 7.5-8.5M15 6.5h5.5V12"/></svg>Evolução</button>
  <button id="n4"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Fichas</button>
  <button id="n5"><svg viewBox="0 0 24 24"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/></svg>Sprint</button>
</nav>
<script>
var R={c:[150,"2–3 min"],i:[75,"60–90 s"]},U="#3b5bdb",L="#0b8f7a",O="#c2570c",G="#64748b",PU="#7048e8",PK="#c2255c",BL="#1c7ed6";
function cp(n,m,s,r){return[n,m,s,r,"c"]}
function iso(n,m,s,r){return[n,m,s,r,"i"]}

var REST={t:"Descanso",f:"Recuperação",c:G,ex:[]};
var PR=[
{id:"model",name:"Treino Model",days:5,freq:"Costas, peito, ombros e pernas 2x por semana",who:"Foco estético: ombros e costas largos (V-taper), cintura fina e pernas proporcionais.",pat:[0,1,2,3,4,-1,-1],W:[
wk("Superior A","Largura de costas, peito e ombros",U,[cp("Barra fixa (pegada aberta)","Costas",4,"6–10"),cp("Supino inclinado com halteres","Peito",4,"8–10"),iso("Puxada na polia alta (pegada aberta)","Costas",3,"10–12"),cp("Desenvolvimento com halteres","Ombros",3,"8–10"),iso("Elevação lateral","Ombro lateral",3,"12–15"),iso("Cross-over","Peito",3,"12–15"),iso("Rosca direta","Bíceps",2,"10"),iso("Tríceps corda","Tríceps",2,"10–12"),iso("Abdominal na polia (crunch)","Abdômen",3,"10–15")]),
wk("Inferior A","Ênfase em quadríceps",L,[cp("Agachamento livre","Quadríceps",4,"8–10"),cp("Leg press 45°","Quadríceps",3,"10–12"),iso("Cadeira extensora","Quadríceps",3,"12–15"),iso("Mesa flexora","Posterior de coxa",4,"10–12"),iso("Panturrilha em pé","Panturrilha",5,"12–15")]),
wk("Superior B","Espessura de costas e peito",U,[cp("Remada curvada ou cavalinho","Costas",4,"8–10"),cp("Supino reto (barra ou halteres)","Peito",3,"8–10"),iso("Remada baixa (pegada neutra)","Costas",3,"10–12"),iso("Supino inclinado na máquina ou crucifixo","Peito",3,"10–12"),iso("Crucifixo inverso","Ombro posterior",3,"12–15"),iso("Elevação lateral na polia","Ombro lateral",3,"12–15"),iso("Rosca martelo","Bíceps",2,"10–12"),iso("Tríceps testa","Tríceps",2,"10–12"),iso("Elevação de pernas","Abdômen",3,"12–15")]),
wk("Inferior B","Posterior de coxa e glúteo",L,[cp("Levantamento terra romeno","Posterior de coxa",4,"8–10"),cp("Afundo búlgaro","Quadríceps",3,"10 por perna"),cp("Hack ou agachamento frontal","Quadríceps",3,"10"),iso("Mesa ou cadeira flexora","Posterior de coxa",4,"10–12"),iso("Cadeira abdutora","Glúteo",3,"15"),iso("Panturrilha sentado","Panturrilha",5,"12–15")]),
wk("Ombros, braços e abdômen","Ajuste fino da silhueta",O,[iso("Elevação lateral (drop set na última série)","Ombro lateral",4,"15"),cp("Desenvolvimento Arnold","Ombros",3,"10"),iso("Face pull ou crucifixo inverso","Ombro posterior",3,"15"),iso("Rosca alternada","Bíceps",2,"10"),iso("Rosca scott ou concentrada","Bíceps",2,"12"),iso("Tríceps na polia","Tríceps",3,"12"),iso("Prancha","Abdômen",3,"30–60 s"),iso("Prancha lateral","Abdômen",2,"20–40 s por lado")],"Dia mais leve da semana. Se chegar cansado, corte as séries pela metade e mantenha só os exercícios principais.")]},
{id:"ppl",name:"PPL (Push/Pull/Legs)",days:6,freq:"Cada músculo 2x por semana",who:"Clássico de 6 dias: empurrar, puxar e pernas, repetido duas vezes. Bom volume, exige boa recuperação.",note:"Se a recuperação pesar, faça 5 dias e deixe o resto para a semana seguinte: o app reorganiza.",pat:[0,1,2,3,4,5,-1],W:[
wk("Push A","Peito, ombros e tríceps",U,[cp("Supino reto (barra ou halteres)","Peito",4,"6–10"),cp("Desenvolvimento com halteres","Ombros",3,"8–10"),cp("Supino inclinado com halteres","Peito",3,"8–12"),iso("Elevação lateral","Ombro lateral",4,"12–15"),iso("Cross-over","Peito",3,"12–15"),iso("Tríceps corda","Tríceps",3,"10–12"),iso("Tríceps testa","Tríceps",2,"10–12")]),

function spToggle(){
  if(SP.run){SP.run=false;SP.left=SP.end-Date.now();spWake(false)}
  else if(SP.ph==="ready"||SP.ph==="done"){SP.n=0;spSet("pre",SP.PRE,Date.now());SP.run=true;spWake(true);beep(660,.15)}
  else{SP.end=Date.now()+SP.left;SP.run=true;spWake(true)}
  spUpdate();
}
function spReset(){
  if(SP.n>0&&SP.ph!=="done")spFinish();
  SP.ph="ready";SP.n=0;SP.run=false;spWake(false);spUpdate();
}
function spStep(d){SP.target=Math.max(1,Math.min(20,SP.target+d));spSave();spUpdate()}
function spDots(){var h="";for(var i=0;i<SP.target;i++)h+='<i class="'+(i<SP.n?"on":(i===SP.n&&SP.ph==="sprint"?"cur":""))+'"></i>';return h}
function spUpdate(){
  var g=function(i){return document.getElementById(i)},x=g("spx");if(!x)return;
  var ph=SP.ph,paused=!SP.run&&ph!=="ready"&&ph!=="done",ms=SP.run?Math.max(0,SP.end-Date.now()):(paused?SP.left:0),sec=Math.ceil(ms/1000);
  x.dataset.ph=ph;
  g("sp-ph").textContent={ready:"Pronto?",pre:"Prepare-se",sprint:"Corrida!",walk:"Caminhada",done:"Concluído!"}[ph]+(paused?" · pausado":"");
  g("sp-t").textContent=ph==="ready"?fmt(SP.SPR):ph==="done"?"00:00":fmt(sec);
  g("sp-n").textContent=ph==="ready"?"Meta: "+SP.target+" tiros de "+SP.SPR+" s":ph==="pre"?"O primeiro tiro começa em instantes":ph==="sprint"?"Tiro "+(SP.n+1)+" de "+SP.target+" · máxima intensidade":ph==="walk"?"Recupere andando · próximo: tiro "+(SP.n+1)+" de "+SP.target:SP.n+" de "+SP.target+" tiros feitos";
  var fr=(ph==="ready"||ph==="done")?1:(SP.tot?ms/(SP.tot*1000):0);
  g("sp-pg").style.strokeDashoffset=(615.75*(1-fr)).toFixed(1);
  g("sp-dots").innerHTML=spDots();g("sp-c").textContent=SP.n;
  g("sp-go").textContent=SP.run?"Pausar":paused?"Continuar":"Iniciar";
  var cfg=(!SP.run&&(ph==="ready"||ph==="done"))?'<span>Quantidade de tiros</span><div class="stp"><button id="sp-m" aria-label="Menos um tiro">−</button><b>'+SP.target+'</b><button id="sp-p" aria-label="Mais um tiro">+</button></div>':"";
  if(cfg!==spCfg){spCfg=cfg;g("sp-cfg").innerHTML=cfg}
}
function sprintView(){
  spCfg="";
  var h='<div class="bar-top"><h1>Sprint</h1></div><p class="sub">Tiros de <b>30 s</b> em máxima intensidade, com <b>3 min</b> de caminhada para recuperar.</p>';
  h+='<div class="spx" id="spx" data-ph="ready"><div class="spring"><svg viewBox="0 0 220 220" aria-hidden="true"><circle class="tr" cx="110" cy="110" r="98"/><circle class="pg" id="sp-pg" cx="110" cy="110" r="98" transform="rotate(-90 110 110)"/></svg><div class="mid"><div class="sph" id="sp-ph"></div><div class="spt" id="sp-t"></div><div class="spn" id="sp-n"></div></div></div><div class="spdots" id="sp-dots"></div><div class="spbig"><b id="sp-c">0</b><span>tiros de 30 s feitos</span></div><div class="spctl"><button class="go" id="sp-go"></button><button class="reset" id="sp-rs">Zerar</button></div><div class="spcfg" id="sp-cfg"></div></div>';
  h+='<div class="spnote">Aqueça 5 a 10 min antes (caminhada e corrida leve) e aumente a velocidade aos poucos. Comece com 4 tiros e suba até 8 conforme se adaptar. Prefira dias de descanso ou treino de superiores, longe dos dias pesados de perna. Pare se sentir tontura, dor no peito ou dor muscular aguda.</div>';
  if(SP.log.length)h+='<div class="splog"><b>Últimas sessões</b>'+SP.log.slice(-5).reverse().map(function(l){return '<div><span>'+dm(l.d)+'</span><span>'+l.n+' de '+l.t+' tiros</span></div>'}).join("")+'</div>';
  return h;
}
setInterval(spTick,250);
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&SP.run)spWake(true)});

document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-open]");
  if(t){open=+t.dataset.open;openLab=t.dataset.h1?{h:t.dataset.h1,d:t.dataset.dy}:null;tab="week";animNext=true;render();window.scrollTo(0,0);return}
  var fin=ev.target.closest("[data-fin]");
  if(fin){var w=+fin.dataset.fin;S.plans[P.id]={last:w,date:TD};Object.keys(S.done).forEach(function(k){if(k.indexOf(P.id+"~"+w+"-")===0)delete S.done[k]});saveDone();savePlan();stopT();go("week");return}
  var pg=ev.target.closest("[data-prog]");
  if(pg){S.prog=pg.dataset.prog;P=progOf(S.prog);savePlan();stopT();go("week");return}
  if(ev.target.closest("#pl-go")){var sw=+document.getElementById("pl-w").value,sd=document.getElementById("pl-d").value||TD;
    if(sd>TD)sd=TD;
    var lastW=P.pat.filter(function(x){return x>=0}).pop();
    S.plans[P.id]=sw<0?{last:lastW,date:shiftDay(-8)}:{last:sw,date:sd};savePlan();go("week");return}
  if(ev.target.closest("#pl-clr")){S.plans[P.id]={last:null,date:null};savePlan();go("week");return}
  if(ev.target.closest("#back")){open=null;openLab=null;animNext=true;render();return}
  if(ev.target.closest("#n1")){go("week");return}
  if(ev.target.closest("#n2")){go("today");return}
  if(ev.target.closest("#n3")){go("evo");return}
  if(ev.target.closest("#n4")){go("prog");return}
  if(ev.target.closest("#n5")){go("sprint");return}
  if(ev.target.closest("#ts")){stopT();return}
  var z=ev.target.closest("[data-zero]");if(z){zero(z.dataset.zero);return}
  if(ev.target.closest("#sp-go")){spToggle();return}
  if(ev.target.closest("#sp-rs")){spReset();return}
  if(ev.target.closest("#sp-m")){spStep(-1);return}
  if(ev.target.closest("#sp-p")){spStep(1);return}
  var s=ev.target.closest(".set");
  if(s){var k=s.dataset.k;if(S.done[k])delete S.done[k];else{S.done[k]=1;lastTap=k;startT(R[s.dataset.r][0])}
    saveDone();render();lastTap=null;var el=document.querySelector('[data-k="'+k+'"]');if(el)el.focus({preventScroll:true})}
});
document.addEventListener("change",function(ev){var e=ev.target;if(e.dataset&&e.dataset.kg!==undefined){setLoad(e.dataset.kg,e.dataset.nm,e.value);render()}});
document.addEventListener("toggle",function(ev){var d=ev.target;if(d.dataset&&d.dataset.sg)openHow[d.dataset.sg]=d.open},true);
render();
initDb();
</script>
